[package]
name = "ozi-rs"
version = "0.1.0"
edition = "2024"

[lib]
name = "ozi_rs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Tauri 2 gates production asset embedding on this feature (the CLI enables it
# for `tauri build`/`tauri dev` bundles). A bare `cargo build --release`
# without it generates a dev context with EMPTY embedded assets — the window
# opens blank (tauri-codegen context.rs: `dev && dev_url.is_some()`).
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"

# Domain / infrastructure
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1.12"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "stream"] }
rusqlite = { version = "0.39", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
gpx = "0.10"
zip = { version = "8.4", default-features = false, features = ["deflate"] }
encoding_rs = "0.8"
ozf2 = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "fs", "io-util"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# PNG encoding for tile delivery
image = { version = "0.25", default-features = false, features = ["png"] }

# Encoding detection for PLT import (cp1251 / UTF-8 / UTF-16 BOM)
chardetng = "0.1"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "test-util"] }
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }
